<div class="modal fade" id="modalNovoProdutoFornecedor" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-md modalAdicionar">
        <div class="modal-content ">
            <div class="modal-header">
                <h5 class="card-title">Adicionar produto credenciado</h5>

                <a type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></a>
            </div>
            <div class="modal-body">
                <form [formGroup]="incluirForm">

                    <div class="row">

                        <div class="col-md-12">
                            <label for="rua">Descrição</label>
                            <input type="text" class="form-control" formControlName="descricao" />
                        </div>

                    </div>

                    <div class="espaco"></div>

                    <div class="row">

                        <div class="col-md-8">
                            <label for="estado">Setor</label>
                            <ng-multiselect-dropdown [placeholder]="'Selecione'" [settings]="listaConfig['setor']"
                                [data]="listaCombos['setor']" formControlName="setor">
                            </ng-multiselect-dropdown>
                        </div>

                        <div class="col-md-4">
                            <label for="valor">Valor (R$)</label>
                            <input type="text" class="form-control" inputmode="numeric" pattern="[0-9]*"
                                [value]="valorFormatado" (input)="formatarValor($event)"
                                (keypress)="permitirSomenteNumeros($event)" />
                        </div>
                    </div>

                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="submit" class="btn btn-primary" (click)="salvarProduto()" [disabled]="incluirForm.invalid">Salvar</button>

            </div>
        </div>
    </div>
</div>
