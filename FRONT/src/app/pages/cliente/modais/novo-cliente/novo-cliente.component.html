<div class="modal fade" id="modalNovoCliente" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg custom-modal-width">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="card-title">Adicionar cliente</h5>
        <a type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></a>
      </div>

      <div class="modal-body">
        <form [formGroup]="incluirForm">
          <div class="mb-3">
            <label for="nome">Nome</label>
            <input class="form-control" id="nome" formControlName="nome" type="text">
          </div>

          <div class="row mt-4">
            <!-- Endereços -->
            <div class="col-md-12">
              <button type="button" class="btn btn-outline-primary w-100" style="margin-bottom: 10px;"
                (click)="openModalNovoEndereco()">
                <i class="bi bi-plus-lg"></i> Adicionar Endereço
              </button>

              <div id="tabelaResponsiva">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Rua</th>
                      <th>Número</th>
                      <th>Bairro</th>
                      <th>CEP</th>
                      <th>Tipo</th>
                      <th></th>

                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let retorno of enderecos ">
                      <td>{{retorno.rua}} </td>
                      <td>{{retorno.numero}} </td>
                      <td>{{retorno.bairro}}</td>
                      <td>{{retorno.cep}}</td>
                      <td>{{retorno.tipo?.descricao}}</td>
                      <td>

                        <div class="icones-container">
                          <a class="icone icone-item-grid iconeExcluir" title="Excluir">
                            <i class="bi bi-trash" (click)="excluirEndereco(retorno)"></i>
                          </a>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>


            <div class="col-md-12">
              <button type="button" class="btn btn-outline-primary w-100" style="margin-bottom: 10px;"
                (click)="openModalNovoContato()">
                <i class="bi bi-plus-lg"></i> Adicionar Contato
              </button>

              <div id="tabelaResponsiva">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Contato</th>
                      <th>Tipo</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let retorno of contatos ">
                      <td>{{retorno.contato}}</td>
                      <td>{{retorno.tipoContato}}</td>

                      <td>

                        <div class="icones-container">
                          <a class="icone icone-item-grid iconeExcluir" title="Excluir">
                            <i class="bi bi-trash" (click)="excluirContato(retorno)"></i>
                          </a>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary" (click)="salvar()">Salvar</button>
      </div>
    </div>
  </div>
</div>
